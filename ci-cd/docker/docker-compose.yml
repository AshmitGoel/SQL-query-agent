version: '3.8'

services:
  backend:
    build:
      context: ../../
      dockerfile: ci-cd/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_PATH=./data/sample.db
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ../../
      dockerfile: ci-cd/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
